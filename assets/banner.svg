<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Welcome To My Digital Universe — Nishant Kumar</title><desc id="desc">Animated futuristic blue and purple banner</desc>
<defs><linearGradient id="bg"><stop stop-color="#020617"/><stop offset=".55" stop-color="#0b102b"/><stop offset="1" stop-color="#1e0a3c"/></linearGradient><linearGradient id="neon"><stop stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#22d3ee" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#a855f7"/></linearGradient><radialGradient id="halo"><stop stop-color="#22d3ee" stop-opacity=".23"/><stop offset="1" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".08"/></pattern></defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/><rect width="1200" height="360" rx="24" fill="url(#grid)"/><circle cx="150" cy="70" r="190" fill="url(#halo)"><animate attributeName="r" values="160;205;160" dur="7s" repeatCount="indefinite"/></circle><circle cx="1050" cy="290" r="190" fill="url(#halo)"><animate attributeName="r" values="205;165;205" dur="8s" repeatCount="indefinite"/></circle>
<path d="M0 300 Q150 255 300 300 T600 300 T900 300 T1200 300V360H0Z" fill="#2563eb" fill-opacity=".1"><animate attributeName="d" values="M0 300 Q150 255 300 300 T600 300 T900 300 T1200 300V360H0Z;M0 300 Q150 330 300 300 T600 300 T900 300 T1200 300V360H0Z;M0 300 Q150 255 300 300 T600 300 T900 300 T1200 300V360H0Z" dur="8s" repeatCount="indefinite"/></path>
<g text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif"><text x="600" y="112" fill="url(#neon)" font-size="50" font-weight="800" filter="url(#glow)">🌌 Welcome To My Digital Universe</text><text x="600" y="172" fill="#a5f3fc" font-size="20" font-weight="600" letter-spacing="7">AI • DATA SCIENCE • CODE • INNOVATION</text><line x1="420" y1="202" x2="780" y2="202" stroke="url(#neon)" stroke-width="2"><animate attributeName="x1" values="500;420;500" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="700;780;700" dur="5s" repeatCount="indefinite"/></line><text x="600" y="260" fill="#f8fafc" font-size="42" font-weight="700" letter-spacing="5">NISHANT KUMAR</text><text x="600" y="306" fill="#94a3b8" font-size="16" letter-spacing="3">BUILDING INTELLIGENT SYSTEMS • ONE COMMIT AT A TIME</text></g><rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#neon)" stroke-opacity=".5" stroke-width="2"/>
</svg>
