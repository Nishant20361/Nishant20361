name: Generate 3D contribution profile
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "profile-3d-contrib/**"
  schedule:
    - cron: "40 0 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated profile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib/
          git diff --cached --quiet || git commit -m "chore: update 3D contribution graph"
          git push
